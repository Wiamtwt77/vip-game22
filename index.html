<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المحكمة السرية</title><style>
:root{--bg:#080b14;--panel:#121a2a;--line:#26334d;--red:#f43f5e;--gold:#fbbf24;--purple:#a855f7;--blue:#38bdf8;--green:#22c55e}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#17213a,#080b14 65%);color:#f8fafc;font-family:system-ui,sans-serif;padding:14px}.app{max-width:760px;margin:auto}.panel{background:#121a2aee;border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 10px 30px #0005}button{border:0;border-radius:9px;padding:11px;width:100%;background:var(--red);color:#fff;font-weight:700;cursor:pointer;margin-top:8px}button.alt{background:#334155}button.buy{background:#2563eb}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px;background:#070b14;color:#fff;margin:5px 0 10px}textarea{min-height:80px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px}.player{background:#080b14;border:1px solid var(--line);padding:10px;border-radius:10px;text-align:center}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px}.card{border:2px solid #334155;background:#1a2437;padding:11px;border-radius:11px;cursor:pointer}.card.sel{border-color:var(--red);background:#36202c}.card.off{opacity:.4;cursor:not-allowed}.box{padding:12px;border-radius:10px;margin:9px 0;text-align:right;white-space:pre-line}.event{border-right:4px solid var(--gold);background:#30200b}.clue{border-right:4px solid var(--purple);background:#21152f}.inbox{border-right:4px solid var(--blue);background:#10263b}.ally{border-right:4px solid var(--purple);background:#28173b}.good{border-right:4px solid var(--green);background:#0e2b20}.muted{color:#a9b4c7;font-size:.86em}.hidden{display:none!important}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.danger{color:#fb7185}.small{font-size:.78em;color:#cbd5e1}
</style></head><body><main class="app"><div class="top"><h1>المحكمة السرية</h1><button class="alt" style="width:auto" onclick="resetGame()">إعادة</button></div>
<section id="setup" class="panel"><h2>إعداد الجلسة</h2><p class="muted">أدخل أسماء اللاعبين مفصولة بفواصل. تُحفظ حالة الجلسة على هذا الجهاز بعد كل مرحلة.</p><input id="names" value="أحمد, سارة, خالد"><button onclick="startGame()">بدء اللعبة</button></section>
<section id="game" class="hidden"><div id="status" class="grid"></div><section id="action" class="panel"><div id="curtain"><h2 id="turnTitle"></h2><button onclick="openTurn()">فتح الدور السري</button></div><div id="turn" class="hidden"><h2 id="playerName"></h2><div id="inbox" class="box inbox hidden"></div><div id="offer" class="box ally hidden"></div><div id="allyStatus" class="box ally hidden"></div><div id="cards" class="cards"></div><div id="targetArea" class="hidden"><label>الهدف</label><select id="target"></select></div><div id="textArea" class="hidden"><label>نص الرسالة</label><textarea id="messageText" maxlength="300"></textarea></div><button onclick="submitAction()">تأكيد الحركة</button><div class="box" style="background:#090f1c"><b>السوق السرية</b><p class="small">السعر: 3 سمعة. الشراء محدود بنسختين لكل بطاقة، وبعده انتظار جولتين.</p><button class="buy" onclick="buyCard()">شراء بطاقة عشوائية</button></div></div></section>
<section id="recap" class="panel hidden"><h2>ملخص الجولة</h2><div id="event" class="box event hidden"></div><div id="public" class="box clue hidden"></div><div id="case" class="box"></div><div id="clue" class="box clue"></div><button onclick="startVote()">الانتقال للتصويت السري</button></section>
<section id="vote" class="panel hidden"><div id="voteCurtain"><h2 id="voteTitle"></h2><button onclick="openVote()">فتح التصويت</button></div><div id="voteForm" class="hidden"><div id="voteCase" class="box"></div><select id="voteTarget"></select><button onclick="submitVote()">تأكيد التصويت</button></div></section></section></main>
<script>
const CARDS={ATTACK:['إدانة هجومية','خصم 3 سمعة وتكوين قضية',2],STEAL:['سرقة نفوذ','سرقة نقطتين من الهدف',3],BOOST:['تعزيز نفوذ','كسب نقطتين ومكافأة الحليف',2],INTERROGATE:['استجواب','معلومة سرية عن جريمة الهدف',3],FORCE_REVEAL:['إجبار الكشف','عرض مخزون الهدف للجميع',4],SECRET_MSG:['رسالة سرية','رسالة تصل إلى بريد الهدف',2]};const BUY_COST=3;let state=null;
const $=id=>document.getElementById(id);function save(){localStorage.setItem('secret-court-state',JSON.stringify(state))}function load(){try{return JSON.parse(localStorage.getItem('secret-court-state'))}catch{return null}}function resetGame(){localStorage.removeItem('secret-court-state');location.reload()}
function startGame(){const names=$('names').value.split(',').map(x=>x.trim()).filter(Boolean);if(names.length<2)return alert('أدخل اسمين على الأقل');state={players:names.map((name,i)=>({id:'p-'+Date.now()+'-'+i,name,reputation:10,inventory:{ATTACK:1,STEAL:1,BOOST:1,INTERROGATE:0,FORCE_REVEAL:0,SECRET_MSG:0},customCards:[],cooldowns:{},shopCooldown:0,allyId:null,allyRoundsLeft:0,allianceOffer:null})),pendingMessages:{},round:1,turn:0,actions:[],votes:[],voteTurn:0};save();showGame();beginRound()}
function showGame(){$('setup').classList.add('hidden');$('game').classList.remove('hidden');renderStatus()}function beginRound(){state.turn=0;state.actions=[];state.votes=[];state.voteTurn=0;state.players.forEach(p=>{for(const k in p.cooldowns)p.cooldowns[k]=Math.max(0,(p.cooldowns[k]||0)-1);p.shopCooldown=Math.max(0,(p.shopCooldown||0)-1)});save();$('recap').classList.add('hidden');$('vote').classList.add('hidden');$('action').classList.remove('hidden');showCurtain()}
function renderStatus(){$('status').innerHTML=state.players.map(p=>`<div class="player"><b>${escapeHtml(p.name)}</b><br>${p.reputation>0?'⭐ '+p.reputation:'<span class="danger">مقصى</span>'}${p.allyId?'<br>🤝 متحالف':''}</div>`).join('')}
function showCurtain(){while(state.turn<state.players.length&&state.players[state.turn].reputation<=0)state.turn++;if(state.turn>=state.players.length)return resolveRound();$('curtain').classList.remove('hidden');$('turn').classList.add('hidden');$('turnTitle').textContent='سلّم الهاتف إلى: '+state.players[state.turn].name}
function openTurn(){const p=state.players[state.turn];$('curtain').classList.add('hidden');$('turn').classList.remove('hidden');$('playerName').textContent=p.name;renderInbox(p);renderOffer(p);renderCards(p);$('targetArea').classList.add('hidden');$('textArea').classList.add('hidden')}
function renderInbox(p){const msgs=state.pendingMessages?.[p.id]||[];$('inbox').classList.toggle('hidden',!msgs.length);$('inbox').innerHTML=msgs.map(m=>`📩 <b>${escapeHtml(m.senderName||'النظام')}:</b> ${escapeHtml(m.text)}${m.warning?`<div class="danger">⚠️ ${escapeHtml(m.warning)}</div>`:''}`).join('<hr>');delete state.pendingMessages[p.id];save()}
function renderOffer(p){const o=p.allianceOffer;$('offer').classList.toggle('hidden',!o);if(o)$('offer').innerHTML=`🤝 عرض تحالف من <b>${escapeHtml(o.fromName)}</b> لمدة 4 جولات.<button onclick="answerAlliance(true)">قبول التحالف</button><button class="alt" onclick="answerAlliance(false)">رفض</button>`;$('allyStatus').classList.toggle('hidden',!p.allyId);if(p.allyId){const a=state.players.find(x=>x.id===p.allyId);$('allyStatus').textContent=`حليفك: ${a?.name||'غير معروف'} — متبقي ${p.allyRoundsLeft} جولات`}}
function answerAlliance(ok){const p=state.players[state.turn],o=p.allianceOffer;if(ok&&o){const a=state.players.find(x=>x.id===o.fromId);if(a&&a.reputation>0){p.allyId=a.id;p.allyRoundsLeft=4;a.allyId=p.id;a.allyRoundsLeft=4}}p.allianceOffer=null;save();renderOffer(p);renderStatus()}
function renderCards(p){const fixed=Object.entries(CARDS).map(([id,v])=>({id,label:v[0],desc:v[1],count:p.inventory[id]||0,cooldown:p.cooldowns[id]||0,generatedCard:null}));const custom=(p.customCards||[]).map(c=>({id:c.id,label:'✨ '+c.name,desc:c.description+' ['+c.effectType+']',count:p.inventory[c.id]||0,cooldown:p.cooldowns[c.id]||0,generatedCard:c}));$('cards').innerHTML=[...fixed,...custom].map(c=>{const disabled=c.count<=0||c.cooldown>0;return `<div class="card ${disabled?'off':''}" onclick="${disabled?'':'selectCard(\''+c.id+'\',this)'}"><b>${escapeHtml(c.label)}</b><br><span class="small">${escapeHtml(c.desc)} · ${c.count} نسخة${c.cooldown?' · تبريد '+c.cooldown+' ج':''}</span></div>`}).join('')}
let selected=null;function selectCard(id,el){selected=id;document.querySelectorAll('.card').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');const custom=state.players[state.turn].customCards?.find(c=>c.id===id);const targetable=custom?!['REPUTATION_GAIN','SHIELD'].includes(custom.effectType):!['BOOST'].includes(id);$('targetArea').classList.toggle('hidden',!targetable);$('textArea').classList.toggle('hidden',id!=='SECRET_MSG'&&custom?.effectType!=='MESSAGE');if(targetable)$('target').innerHTML=state.players.map(p=>p.id!==state.players[state.turn].id&&p.reputation>0?`<option value="${p.id}">${escapeHtml(p.name)}</option>`:'').join('')}
function submitAction(){if(!selected)return alert('اختر بطاقة');const p=state.players[state.turn],custom=p.customCards?.find(c=>c.id===selected),targetable=custom?!['REPUTATION_GAIN','SHIELD'].includes(custom.effectType):!['BOOST'].includes(selected),targetId=targetable?$('target').value:null;if(targetable&&!targetId)return alert('لا يوجد هدف صالح');if((p.inventory[selected]||0)<=0)return alert('لا تملك هذه البطاقة');if((p.cooldowns[selected]||0)>0)return alert('البطاقة في فترة تبريد');if((selected==='SECRET_MSG'||custom?.effectType==='MESSAGE')&&!String($('messageText').value).trim())return alert('اكتب الرسالة');p.cooldowns[selected]=custom?.cooldown||CARDS[selected]?.[2]||2;state.actions.push({playerId:p.id,cardId:custom?'AI_CARD':selected,generatedCard:custom||null,targetId,text:$('messageText').value});selected=null;state.turn++;save();renderStatus();showCurtain()}
async function buyCard(){const p=state.players[state.turn];if(p.reputation<BUY_COST)return alert('السمعة غير كافية');if(p.shopCooldown>0)return alert('السوق في انتظار '+p.shopCooldown+' جولة');try{const data=await post({action:'generate_card',player:p,round:state.round,existingCards:p.customCards||[]});const card=data.card;p.reputation-=BUY_COST;p.shopCooldown=2;p.customCards=p.customCards||[];p.customCards.push(card);p.inventory[card.id]=1;save();renderStatus();renderCards(p);alert((data.aiUsed?'✨ بطاقة جديدة من الذكاء الاصطناعي: ':'بطاقة بديلة: ')+card.name)}catch(e){alert('تعذر توليد البطاقة: '+e.message)}}
async function resolveRound(){$('action').classList.add('hidden');try{const data=await post({action:'resolve_round',players:state.players,actions:state.actions,pendingMessages:state.pendingMessages});state.players=data.players;state.pendingMessages=data.pendingMessages;state.currentCase=data.courtCase;state.randomEvent=data.randomEvent;state.publicReveals=data.publicReveals;state.ai=data.ai;state.round++;save();renderStatus();showRecap()}catch(e){alert('تعذر حسم الجولة: '+e.message);$('action').classList.remove('hidden')}}
function showRecap(){$('recap').classList.remove('hidden');$('event').classList.toggle('hidden',!state.randomEvent);if(state.randomEvent)$('event').textContent='حدث عشوائي نسبي: '+state.randomEvent.description;$('public').classList.toggle('hidden',!state.publicReveals?.length);if(state.publicReveals)$('public').textContent=state.publicReveals.map(x=>`${x.askerName} أجبر ${x.targetName} على كشف: ${JSON.stringify(x.inventory)}`).join('\n');$('case').textContent=state.currentCase.title;$('clue').textContent=state.currentCase.clue+'\nدرجة الثقة النسبية: '+state.currentCase.confidence+'%'+(state.ai?.used?'\nتم تحسين الدليل بواسطة OpenRouter.':'')}
function startVote(){state.voteTurn=0;state.votes=[];$('recap').classList.add('hidden');$('vote').classList.remove('hidden');showVoteCurtain()}function showVoteCurtain(){while(state.voteTurn<state.players.length&&state.players[state.voteTurn].reputation<=0)state.voteTurn++;if(state.voteTurn>=state.players.length)return finalizeVotes();$('voteCurtain').classList.remove('hidden');$('voteForm').classList.add('hidden');$('voteTitle').textContent='التصويت السري للاعب: '+state.players[state.voteTurn].name}
function openVote(){$('voteCurtain').classList.add('hidden');$('voteForm').classList.remove('hidden');$('voteCase').textContent=state.currentCase.title;$('voteTarget').innerHTML='<option value="NONE">لا أحد</option>'+state.players.map(p=>p.reputation>0&&p.id!==state.players[state.voteTurn].id?`<option value="${p.id}">${escapeHtml(p.name)}</option>`:'').join('')}
function submitVote(){state.votes.push({voterId:state.players[state.voteTurn].id,accusedId:$('voteTarget').value==='NONE'?null:$('voteTarget').value});state.voteTurn++;save();showVoteCurtain()}
async function finalizeVotes(){const data=await post({action:'resolve_votes',players:state.players,votes:state.votes,trueCulpritId:state.currentCase.trueCulpritId});state.players=data.players;save();alert(data.verdictMsg+'\n\nالدليل الختامي النسبي: '+data.finalEvidence.confidence+'%\n'+data.finalEvidence.conclusion+'\n'+data.finalEvidence.note);const alive=state.players.filter(p=>p.reputation>0);if(alive.length<=1){alert('انتهت اللعبة. الفائز: '+(alive[0]?.name||'لا أحد'));return resetGame()}state.round++;beginRound()}
async function post(body){const r=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error||'خطأ غير معروف');return d}function escapeHtml(v){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
state=load();if(state?.players?.length){showGame();if(state.currentCase)showRecap();else beginRound()}
</script></body></html>
